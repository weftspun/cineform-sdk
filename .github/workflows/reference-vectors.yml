# Does the NEON path produce the same bitstream as the SSE2/MMX path it replaces?
#
# This cannot be answered on one machine. A Mac runs an x86 build under Rosetta, which
# does its own SSE-to-NEON translation, so a local A/B compares one translation against
# another and neither side is native. Two runners settle it: ubuntu-latest is real x86_64,
# macos-latest is real Apple Silicon.
#
# TestCFHD -d is the vector source because it is deterministic by construction: QBIST with
# a fixed seed (Example/TestCFHD.cpp, QBIST_SEED 50), so the same input reaches the encoder
# on both machines without shipping a fixture.
#
# WHAT FAILS THIS JOB. A PSNR divergence beyond the tolerance, which would mean a shim is
# wrong. Differing byte counts do NOT fail it: the shim is a port rather than a bit-exact
# reimplementation, and whether the bitstreams match is a fact worth recording rather than
# a rule worth enforcing. The summary says which happened.
name: reference-vectors

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vectors:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # EncoderSDK/StdAfx.h includes <uuid/uuid.h> on every non-Windows target and the
      # CMakeLists links -luuid under UNIX. uuid_generate is in libSystem on macOS, so
      # nothing is installed there.
      - name: Install libuuid
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y uuid-dev

      - name: Confirm the runner is the architecture we think it is
        run: |
          set -eux
          uname -m
          test "$(uname -m)" = "${{ matrix.arch }}" || {
            echo "runner is $(uname -m), matrix says ${{ matrix.arch }}"; exit 1; }

      - name: Build TestCFHD
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_TOOLS=ON
          cmake --build build --parallel

      - name: Run the vectors
        run: ./build/TestCFHD -d | tee vectors-${{ matrix.arch }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: vectors-${{ matrix.arch }}
          path: vectors-${{ matrix.arch }}.txt

  compare:
    needs: vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'vectors-*', merge-multiple: true }
      - name: Compare x86_64 against arm64
        run: |
          python3 scripts/compare_vectors.py \
            vectors-x86_64.txt vectors-arm64.txt x86_64 arm64 | tee compare.txt
      - name: Summary
        if: always()
        run: |
          { echo '## Reference vectors: x86_64 vs arm64'; echo; echo '```';
            cat compare.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
